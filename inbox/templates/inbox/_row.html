<a id="conversation-{{ conversation.id }}"{% if oob %} hx-swap-oob="outerHTML"{% endif %} class="{% if selected.id == conversation.id %}active{% endif %}" href="{% querystring conversation=conversation.id reply=None sync=None %}" hx-get="{% querystring conversation=conversation.id reply=None sync=None %}" hx-target="#thread" hx-select="#thread" hx-swap="outerHTML settle:0s swap:0s" hx-push-url="true" hx-on:htmx:config-request="var body = document.querySelector('#thread [id^=conversation-body]'); if (body && window.htmx) htmx.trigger(body, 'htmx:abort'); var inbox = document.getElementById('inbox'); if (inbox) inbox.setAttribute('data-open', this.id.replace('conversation-',''));">
  <strong>{{ conversation.title }}{% if conversation.needs_reply %} <span class="open-dot" aria-label="Open"></span>{% endif %}</strong>
  <span class="channel">{{ conversation.channel }}</span>
  <span>{{ conversation.preview|truncatechars:80 }}</span>
</a>
