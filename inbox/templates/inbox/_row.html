<a id="conversation-{{ conversation.id }}"{% if oob %} hx-swap-oob="outerHTML"{% endif %} class="{% if selected.id == conversation.id %}active{% endif %}" href="{% querystring conversation=conversation.id reply=None sync=None %}" hx-get="{% querystring conversation=conversation.id reply=None sync=None %}" hx-target="#thread" hx-select="#thread" hx-swap="outerHTML settle:0s swap:0s" hx-push-url="true" hx-on:click="this.parentElement.querySelectorAll('a').forEach(function (el) { el.classList.remove('active'); }); this.classList.add('active')">
  <strong>{{ conversation.title }}{% if conversation.needs_reply %} <span class="open-dot" aria-label="Open"></span>{% endif %}</strong>
  <span class="channel">{{ conversation.channel }}</span>
  <span>{{ conversation.preview|truncatechars:80 }}</span>
</a>
