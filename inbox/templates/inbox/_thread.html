<section id="thread" class="chat-thread"{% if selected %} data-conversation="{{ selected.id }}"{% endif %}{% if reply_pending %} data-sending="true" hx-get="{% url 'inbox' %}?conversation={{ selected.id }}&amp;poll=sending" hx-trigger="every 1s" hx-target="#thread" hx-select="#thread" hx-swap="outerHTML settle:0s swap:0s"{% endif %}>
  {% if selected %}
    <div id="conversation" class="conversation">
      {% include "inbox/_conversation_body.html" %}
    </div>
    <div id="composer-slot">
      {% include "inbox/_composer.html" %}
    </div>
  {% else %}
    <p class="muted">No messages yet.</p>
  {% endif %}
</section>
{% if oob and selected %}
  {% include "inbox/_row.html" with conversation=selected oob=True %}
{% endif %}
