{% extends "base.html" %}

{% block title %}Profile{% endblock %}

{% block content %}
  <h1>Profile</h1>
  {% if profile.avatar_url %}
    <img class="avatar" src="{{ profile.avatar_url }}" alt="">
  {% endif %}
  <dl>
    <dt>Email</dt>
    <dd>{{ user.email }}</dd>
    <dt>Name</dt>
    <dd>{{ profile.display_name|default:user.get_username }}</dd>
  </dl>
{% endblock %}
