{% extends "base.html" %}

{% block title %}Cashflow{% endblock %}

{% block content %}
  {% with active_tab="movements" %}{% include "cashflow/_tabs.html" %}{% endwith %}
  <h1>Cashflow</h1>
  <form
    class="filters"
    method="get"
    action="{% url 'cashflow' %}"
    hx-get="{% url 'cashflow' %}"
    hx-target="#cashflow-results"
    hx-swap="outerHTML"
    hx-push-url="true"
    hx-trigger="change, submit"
  >
    <div>
      <label for="category">Category</label>
      <select id="category" name="category">
        <option value="">All</option>
        {% for value in categories %}
          <option value="{{ value }}" {% if value == category %}selected{% endif %}>{{ value }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="currency">Currency</label>
      <select id="currency" name="currency">
        <option value="">All</option>
        {% for value in currencies %}
          <option value="{{ value }}" {% if value == currency %}selected{% endif %}>{{ value }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="date_from">From</label>
      <input id="date_from" type="date" name="date_from" value="{{ date_from }}">
    </div>
    <div>
      <label for="date_to">To</label>
      <input id="date_to" type="date" name="date_to" value="{{ date_to }}">
    </div>
    <div>
      <label for="amount_confidence_from">Amount confidence from</label>
      <input id="amount_confidence_from" type="number" name="amount_confidence_from" min="0" max="1" step="0.001" value="{{ amount_confidence_from }}">
    </div>
    <div>
      <label for="amount_confidence_to">Amount confidence to</label>
      <input id="amount_confidence_to" type="number" name="amount_confidence_to" min="0" max="1" step="0.001" value="{{ amount_confidence_to }}">
    </div>
  </form>
  {% include "cashflow/_results.html" %}
  <script>
    function fitDescriptions() {
      document.querySelectorAll("#cashflow-table .description-text.clamped").forEach(function (text) {
        var more = text.parentElement.querySelector(".more");
        if (!more || more.getAttribute("aria-expanded") === "true") return;
        more.hidden = text.scrollHeight <= text.clientHeight + 1;
      });
    }
    document.addEventListener("click", function (event) {
      var more = event.target.closest("button.more");
      if (!more) return;
      var text = more.parentElement.querySelector(".description-text");
      var open = more.getAttribute("aria-expanded") === "true";
      text.classList.toggle("clamped", open);
      more.hidden = false;
      more.setAttribute("aria-expanded", open ? "false" : "true");
      more.textContent = open ? "…more" : "less";
    });
    document.addEventListener("DOMContentLoaded", fitDescriptions);
    document.body.addEventListener("htmx:afterSwap", fitDescriptions);
  </script>
{% endblock %}
