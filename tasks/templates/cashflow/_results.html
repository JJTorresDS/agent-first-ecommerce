<div id="cashflow-results">
  <p>
    <a href="{% url 'cashflow_csv' %}?{{ filter_query }}">Export CSV</a>
  </p>
  <div class="table-scroll">
  {% include "cashflow/_table.html" %}
  </div>
  <nav class="pager" aria-label="Pages">
    {% if page_obj.has_previous %}
      <a
        href="{% url 'cashflow' %}?page={{ page_obj.previous_page_number }}&amp;{{ filter_query }}"
        hx-get="{% url 'cashflow' %}?page={{ page_obj.previous_page_number }}&amp;{{ filter_query }}"
        hx-target="#cashflow-results"
        hx-swap="outerHTML"
        hx-push-url="true"
      >Previous</a>
    {% endif %}
    <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a
        href="{% url 'cashflow' %}?page={{ page_obj.next_page_number }}&amp;{{ filter_query }}"
        hx-get="{% url 'cashflow' %}?page={{ page_obj.next_page_number }}&amp;{{ filter_query }}"
        hx-target="#cashflow-results"
        hx-swap="outerHTML"
        hx-push-url="true"
      >Next</a>
    {% endif %}
  </nav>
</div>
