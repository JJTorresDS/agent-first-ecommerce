<div class="field check-field{% if field.errors %} has-error{% endif %}">
  <label class="check-label" for="{{ field.id_for_label }}">{{ field }} {{ field.label }}</label>
  {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
</div>
